<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <title>Expense Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
          <link rel="stylesheet"
      th:href="@{/css/style.css}">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand fw-bold"
           th:href="@{/}">
            💰 Smart Expense Tracker
        </a>

    </div>

</nav>

<div class="container mt-4">

    <div class="row">

        <!-- Add Expense -->

        <div class="col-md-4">

            <div class="card shadow">

                <div class="card-header bg-success text-white">

                    <h4>Add Expense</h4>

                </div>

                <div class="card-body">

                    <form th:action="@{/save}"
                          th:object="${expense}"
                          method="post">

                        <div class="mb-3">

                            <label class="form-label">
                                Title
                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{title}">

                            <small class="text-danger"
                                   th:errors="*{title}">
                            </small>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Amount
                            </label>

                            <input type="number"
                                   step="0.01"
                                   class="form-control"
                                   th:field="*{amount}">

                            <small class="text-danger"
                                   th:errors="*{amount}">
                            </small>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Category
                            </label>
<select class="form-select" th:field="*{category}">

    <option value="">Select</option>

    <option value="Food">Food</option>
    <option value="Travel">Travel</option>
    <option value="Shopping">Shopping</option>
    <option value="Education">Education</option>
    <option value="Medical">Medical</option>
    <option value="Entertainment">Entertainment</option>
    <option value="Other">Other</option>

</select>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Date
                            </label>

                            <input type="date"
                                   class="form-control"
                                   th:field="*{date}">

                        </div>

                        <button class="btn btn-success w-100">

                            Save Expense

                        </button>

                    </form>

                </div>

            </div>

        </div>

        <!-- Expense Details -->

        <div class="col-md-8">

            <div class="total-card mb-3">

                <div class="card-body">

                    <div class="row">

                        <div class="col-md-6">

                            <h4>Total Expense</h4>

                            <h2 class="text-primary">

                                ₹ <span th:text="${totalExpense}">
                                </span>

                            </h2>

                        </div>

                        <div class="col-md-6 text-end">

                            <form th:action="@{/category}"
                                  method="get">

                                <div class="input-group">

                                    <input
                                            class="form-control"
                                            name="category"
                                            placeholder="Food">

                                    <button
                                            class="btn btn-primary">

                                        Filter

                                    </button>

                                </div>

                            </form>

                            <a th:href="@{/all}"
                               class="btn btn-secondary mt-2">

                                Show All

                            </a>

                        </div>

                    </div>

                </div>

            </div>

            <div class="card shadow">

                <div class="card-header bg-dark text-white">

                    <h4>Expense List</h4>

                </div>

                <div class="card-body">

                    <table class="table table-bordered table-hover">

                        <thead>

                        <tr>

                            <th>ID</th>
                            <th>Title</th>
                            <th>Amount</th>
                            <th>Category</th>
                            <th>Date</th>
                            <th>Action</th>

                        </tr>

                        </thead>

                        <tbody>

                        <tr th:each="expense : ${expenses}">

                            <td th:text="${expense.id}"></td>

                            <td th:text="${expense.title}"></td>

                            <td>
                                ₹
                                <span
                                        th:text="${expense.amount}">
                                </span>
                            </td>

                            <td th:text="${expense.category}">
                            </td>

                            <td th:text="${expense.date}">
                            </td>

                            <td>

                                <a class="btn btn-danger btn-sm"

                                   th:href="@{'/delete/' + ${expense.id}}">

                                    Delete

                                </a>

                            </td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(expenses)}">

                            <td colspan="6"
                                class="text-center">

                                No Expenses Found

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>
<div class="footer">

    Smart Expense Tracker © 2026

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
